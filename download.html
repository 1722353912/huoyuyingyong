<!-- download.html - 后端下载跳转页面（存放所有下载链接） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在下载 - 嚯雨应用</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        secondary: '#8B5CF6',
                        dark: '#0F172A'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            min-height: 100vh;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="font-sans flex items-center justify-center">
    <div class="bg-white rounded-3xl p-12 shadow-2xl text-center max-w-md mx-4">
        <div class="w-24 h-24 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center mx-auto mb-8 pulse">
            <i class="fa fa-download text-white text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-dark mb-4">正在准备下载</h1>
        <p id="app-name" class="text-xl text-gray-600 mb-8">请稍候...</p>
        <div class="w-full bg-gray-200 rounded-full h-3 mb-8">
            <div id="progress-bar" class="bg-gradient-to-r from-primary to-secondary h-3 rounded-full transition-all duration-1000" style="width: 0%"></div>
        </div>
        <p class="text-gray-500 mb-6">如果下载没有自动开始，请<a id="manual-link" href="#" class="text-primary font-semibold hover:underline">点击这里</a>手动下载</p>
        <a href="index.html" class="inline-block text-gray-600 hover:text-primary transition-colors">
            <i class="fa fa-arrow-left mr-2"></i>返回首页
        </a>
    </div>

    <script>
        // ===================== 后端下载链接配置区 =====================
        // 在这里添加/修改所有应用和插件的下载链接
        const downloadLinks = {
            '1': 'https://pan.baidu.com/s/1CdH43s4l3OhxiAnmQ-W41w pwd=gnyi',
            '2': 'https://example.com/video-player-setup.exe',
            '3': 'https://example.com/zip-tool-setup.exe',
            '4': '应用/截图大师_1144_1256f.exe',
            'google-translate': 'https://example.com/google-translate.crx',
            'ad-blocker': 'https://example.com/ad-blocker.crx',
            'password-manager': 'https://example.com/password-manager.crx',
            'pdf-tool': 'https://example.com/pdf-tool-setup.exe'
        };

        // 应用名称映射
        const appNames = {
            '1': '极速浏览器',
            '2': '全能视频播放器',
            '3': '万能压缩工具',
            '4': '专业截图工具',
            'google-translate': '谷歌翻译助手',
            'ad-blocker': '广告拦截大师',
            'password-manager': '安全密码管理器',
            'pdf-tool': 'PDF全能工具'
        };
        // ============================================================

        // 获取URL参数中的应用ID
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('id');
        const downloadUrl = downloadLinks[appId];
        const appName = appNames[appId] || '未知应用';

        // 更新页面显示
        document.getElementById('app-name').textContent = appName;
        document.getElementById('manual-link').href = downloadUrl;

        // 模拟进度条
        let progress = 0;
        const progressBar = document.getElementById('progress-bar');
        const progressInterval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 100) {
                progress = 100;
                clearInterval(progressInterval);
                
                // 自动触发下载
                setTimeout(() => {
                    window.location.href = downloadUrl;
                }, 500);
            }
            progressBar.style.width = `${progress}%`;
        }, 200);
    </script>
</body>
</html>
